[project]
name = "eoncloak"
version = "0.1.0"
description = "Anonymise documents (text, DOCX, PDF, emails) with AI, using a cloud or a local LLM, keeping consistent pseudonyms."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Rossi" }]
requires-python = ">=3.11"
keywords = ["anonymization", "pseudonymization", "pii", "gdpr", "llm", "privacy", "redaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Text Processing",
]
dependencies = [
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "phonenumbers>=8.13",
    "olefile>=0.46",
]

[project.urls]
Homepage = "https://github.com/ThomasRossi/eoncloak"
Issues = "https://github.com/ThomasRossi/eoncloak/issues"
Changelog = "https://github.com/ThomasRossi/eoncloak/releases"

[project.scripts]
eoncloak = "eoncloak.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eoncloak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
